<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservasi - Klinik Nabilah Pulungan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --bg-primary: #FFF8F9;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --text-primary: #111827;
      --text-secondary: #6b7280;
      --text-accent: #FF6B8A;
      --border-primary: #e5e7eb;
      --border-accent: #FF6B8A;
      --scroll-track: #FFF0F5;
      --scroll-thumb: #FFC0CB;
    }

    html.dark {
      --bg-primary: #111827;
      --bg-secondary: #1f2937;
      --bg-card: #1f2937;
      --text-primary: #f9fafb;
      --text-secondary: #d1d5db;
      --text-accent: #f9a8d4;
      --border-primary: #4b5563;
      --border-accent: #f9a8d4;
      --scroll-track: #374151;
      --scroll-thumb: #4b5563;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      transition: background-color 0.3s, color 0.3s;
    }

    .bg-secondary { background-color: var(--bg-secondary); }
    .bg-card { background-color: var(--bg-card); }
    .border-primary { border-color: var(--border-primary); }
    .text-secondary { color: var(--text-secondary); }
    .theme-pink { color: var(--text-accent); }
    .bg-theme-pink { background-color: var(--border-accent); }
    .border-theme-pink { border-color: var(--border-accent); }

    .active-tab { border-bottom: 3px solid var(--border-accent); color: var(--text-accent); font-weight: 600; }
    .tab { border-bottom: 3px solid transparent; }

    .input-field { background-color: var(--bg-secondary); border-color: var(--border-primary); color: var(--text-primary); }
    html.dark .input-field { background-color: #2d3748; border-color: #4a5568; color: #f7fafc; }
    .input-readonly { background-color: #e5e7eb; }
    html.dark .input-readonly { background-color: #4a5568; color: #e2e8f0; }

    .chart-canvas-container { position: relative; height: 250px; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--scroll-track); }
    ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-accent); }

    #opening-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #FFF8F9; z-index: 100; display: flex; justify-content: center; align-items: center; flex-direction: column; transition: opacity 1s ease-out; }
    #opening-animation .logo { animation: logo-fade-in 2s ease-in-out; }
    .petal { position: absolute; top: -10%; background-color: #FFB7C5; border-radius: 50% 0; width: 20px; height: 20px; animation: blossom-fall 7s linear infinite; }
    .loader { border: 4px solid #f3f3f3; border-radius: 50%; border-top: 4px solid #FF6B8A; width: 40px; height: 40px; animation: spin 1s linear infinite; }

    .notification-badge { position: absolute; top: 2px; right: 12px; min-width: 20px; height: 20px; border-radius: 50%; background-color: #ef4444; color: white; font-size: 12px; font-weight: bold; display: flex; align-items: center; justify-content: center; padding: 2px; transform: scale(0); transition: transform 0.3s ease-in-out; }
    .notification-badge.visible { transform: scale(1); }

    .duplicate-warning { background-color: #fef3c7; border: 1px solid #f59e0b; border-radius: 8px; padding: 8px 12px; margin-top: 8px; font-size: 0.875rem; display: flex; align-items: center; gap: 8px; }
    html.dark .duplicate-warning { background-color: #451a03; border-color: #d97706; }
    .duplicate-warning.hidden { display: none; }

    .full-schedule-popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2); z-index: 100; padding: 24px; max-width: 400px; width: 90%; text-align: center; }
    html.dark .full-schedule-popup { background-color: #1f2937; color: white; }
    .full-schedule-popup.hidden { display: none; }

    .modal-close-btn { position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 1.5rem; color: var(--text-secondary); cursor: pointer; transition: color 0.3s; }
    .modal-close-btn:hover { color: var(--text-primary); }

    html.dark .duplicate-patient-item { border-color: #4b5563; }
    html.dark .duplicate-patient-item:hover { background-color: #374151; }
    html.dark #duplicate-search-input { background-color: #2d3748; border-color: #4a5568; color: #f7fafc; }
    html.dark #duplicate-search-input::placeholder { color: #a0aec0; }
    html.dark #duplicate-list-container .border-gray-200 { border-color: #4b5563; }
    html.dark #duplicate-list-container .bg-gray-50 { background-color: #1f2937; }
    html.dark #duplicate-patient-modal .bg-gray-50 { background-color: #1f2937; }
    html.dark #duplicate-patient-modal .border-gray-100 { border-color: #374151; }
    html.dark #duplicate-patient-modal button.bg-white { background-color: #374151; color: #e5e7eb; }
    html.dark #duplicate-patient-modal button.bg-white:hover { background-color: #4b5563; }
    html.dark .patient-name { color: #f3f4f6; }
    html.dark .patient-rme { color: #9ca3af; }
    html.dark .patient-info { color: #d1d5db; }

    /* Dashboard Estetik CSS */
    .glass-dashboard {
      background: linear-gradient(135deg, rgba(255, 107, 138, 0.1), rgba(255, 192, 203, 0.05));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 107, 138, 0.2);
    }
    html.dark .glass-dashboard {
      background: linear-gradient(135deg, rgba(249, 168, 212, 0.1), rgba(31, 41, 55, 0.5));
      border: 1px solid rgba(249, 168, 212, 0.2);
    }

    @keyframes blossom-fall { 0% { transform: translateY(-100%) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(360deg); opacity: 0; } }
    @keyframes logo-fade-in { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>

<body class="overscroll-none">
  <div id="opening-animation">
    <div class="petal" style="left: 10%; animation-delay: 0s;"></div>
    <div class="petal" style="left: 20%; animation-delay: 2s;"></div>
    <div class="petal" style="left: 30%; animation-delay: 1s;"></div>
    <div class="petal" style="left: 40%; animation-delay: 4s;"></div>
    <div class="petal" style="left: 50%; animation-delay: 0.5s;"></div>
    <div class="petal" style="left: 60%; animation-delay: 3s;"></div>
    <div class="petal" style="left: 70%; animation-delay: 1.5s;"></div>
    <div class="petal" style="left: 80%; animation-delay: 5s;"></div>
    <div class="logo text-center">
      <h1 class="text-4xl font-bold" style="color: #FF6B8A;">Klinik Nabilah Pulungan</h1>
      <p class="text-gray-500 mt-2">Reservasi Online</p>
    </div>
  </div>

  <div id="main-content" class="hidden">
    <div class="container mx-auto max-w-lg p-4 pb-24">
      <header id="main-header" class="text-center my-4 relative"></header>
      <div id="search-container" class="mb-4 relative hidden"></div>
      <main id="app-content"></main>
    </div>

    <div id="booking-cart-fab" class="fixed bottom-24 right-5 z-20 hidden">
      <button onclick="showReservationForm()" class="bg-theme-pink text-white rounded-full w-16 h-16 shadow-lg flex items-center justify-center transition-transform hover:scale-110">
        <i class="fas fa-calendar-check text-2xl"></i>
        <span id="cart-count" class="absolute -top-1 -right-1 bg-pink-600 text-white text-xs rounded-full px-2 py-1">0</span>
      </button>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 max-w-lg mx-auto border-t shadow-md bg-secondary border-primary">
      <div class="flex justify-around">
        <button data-tab="home" class="nav-tab active-tab flex-1 py-2 px-1 text-center text-secondary"><i class="fas fa-home text-xl"></i><span class="block text-xs mt-1">Home</span></button>
        <button data-tab="reservations" class="nav-tab tab flex-1 py-2 px-1 text-center text-secondary relative"><i class="fas fa-list-alt text-xl"></i><span class="block text-xs mt-1">Reservasi</span><span id="reservation-notification-badge" class="notification-badge">0</span></button>
        <button data-tab="pasien" class="nav-tab tab flex-1 py-2 px-1 text-center text-secondary"><i class="fas fa-users text-xl"></i><span class="block text-xs mt-1">Pasien</span></button>
        <button data-tab="rekap" class="nav-tab tab flex-1 py-2 px-1 text-center text-secondary"><i class="fas fa-chart-pie text-xl"></i><span class="block text-xs mt-1">Laporan</span></button>
        <button data-tab="management" class="nav-tab tab flex-1 py-2 px-1 text-center text-secondary"><i class="fas fa-cogs text-xl"></i><span class="block text-xs mt-1">Manajemen</span></button>
      </div>
    </nav>
  </div>

  <div id="modals-container"></div>
  <div id="global-loader" class="fixed inset-0 z-50 bg-black bg-opacity-30 items-center justify-center hidden">
    <div class="loader"></div>
  </div>

  <div id="full-schedule-popup" class="full-schedule-popup hidden">
    <button class="modal-close-btn" onclick="closeModal('full-schedule-popup')"><i class="fas fa-times"></i></button>
    <div class="mb-4">
      <i class="fas fa-calendar-times text-4xl text-red-500 mb-3"></i>
      <h3 class="text-xl font-bold mb-2">Waktu Reservasi Penuh</h3>
      <p class="text-gray-600 dark:text-gray-300">Maaf, waktu yang Anda pilih sudah penuh. Silakan pilih waktu lain yang tersedia.</p>
    </div>
    <button id="close-full-schedule-popup" class="bg-theme-pink text-white px-4 py-2 rounded-lg w-full">Pilih Waktu Lain</button>
  </div>

  <script>
    // MASUKKAN URL DEPLOY GOOGLE APPS SCRIPT ANDA DI SINI
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw_FtGrjkFKgfBoBsNr5QVjNR8j3BbefSQXIz_b7CepMFYDMs6W1Qt9SdmHn_ISNW89/exec'; 

    let state = {
      activeTab: 'home',
      isAuthenticated: false,
      pendingAction: null,
      activeHomeTab: 'treatments',
      treatmentFilter: 'All',
      selectedItems: [],
      data: {
        treatments: [],
        products: [],
        searchResults: [],
        allReservations: [],
        allPatients: [],
        therapists: [],
        settings: {
            jamBuka: '08:30',
            jamTutup: '21:30',
            istirahatMulai: '12:00',
            istirahatSelesai: '13:00',
            maksSlot: 2
        }
      },
      rekapData: null,
      rekapFilteredData: null,
      currentCalendarDate: new Date(),
      newReservationCount: 0,
      duplicatePatientCheck: { isChecking: false, matches: [], lastChecked: null }
    };

    function runOpeningAnimation() {
      setTimeout(() => {
        const openingScreen = document.getElementById('opening-animation');
        openingScreen.style.opacity = '0';
        setTimeout(() => { openingScreen.style.display = 'none'; document.getElementById('main-content').classList.remove('hidden'); }, 1000);
      }, 3000);
    }

    function setupEventListeners() {
      document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', () => navigateTo(tab.dataset.tab));
      });
      document.getElementById('close-full-schedule-popup').addEventListener('click', () => {
        document.getElementById('full-schedule-popup').classList.add('hidden');
      });
    }

    async function callBackend(method, action, payload = {}) {
      setLoading(true);
      try {
        let url = SCRIPT_URL;
        const cacheBuster = new Date().getTime();
        const options = { method, redirect: "follow", cache: "no-store", headers: { 'Content-Type': 'text/plain;charset=utf-8' } };

        if (method === 'GET') {
          url += `?action=${action}&payload=${encodeURIComponent(JSON.stringify(payload))}&_cb=${cacheBuster}`;
        } else {
          options.body = JSON.stringify({ action, payload });
        }

        const response = await fetch(url, options);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        return await response.json();
      } catch (error) {
        console.error('Error calling backend:', error);
        showToast('Terjadi kesalahan koneksi ke server.', 'error');
        return { status: 'error', message: 'Terjadi kesalahan koneksi.' };
      } finally {
        setLoading(false);
      }
    }

    async function navigateTo(tabName) {
      const protectedTabs = ['pasien', 'rekap', 'management'];
      if (protectedTabs.includes(tabName) && !state.isAuthenticated) {
        showPasswordModal(tabName);
        return;
      }
      state.activeTab = tabName;
      updateActiveNavTab(tabName);

      const appContent = document.getElementById('app-content');
      const header = document.getElementById('main-header');
      const searchContainer = document.getElementById('search-container');

      appContent.innerHTML = `<div class="text-center p-8"><div class="loader inline-block"></div></div>`;
      const themeButton = `<button id="theme-toggle" onclick="toggleTheme()" class="absolute top-0 right-0 p-2 text-lg text-secondary"><i id="theme-toggle-icon" class="fas fa-moon"></i></button>`;

      const showSearch = ['home', 'reservations', 'pasien'].includes(tabName);
      searchContainer.classList.toggle('hidden', !showSearch);
      if (showSearch) setupSearchInput(tabName);
      updateCartFab();
      
      await fetchDataIfNeeded();

      if (tabName === 'reservations' && state.newReservationCount > 0) {
        showToast(`Ada ${state.newReservationCount} reservasi baru hari ini.`, 'info');
        const todayReservations = state.data.allReservations.filter(r => {
          const resDate = new Date(r.Timestamp);
          const today = new Date();
          return r.Status === 'Menunggu' && r.Telah_Dilihat !== true && resDate.toDateString() === today.toDateString();
        });
        const idsToMark = todayReservations.map(r => r.ID_Reservasi);
        if (idsToMark.length > 0) {
          await callBackend('POST', 'markReservationsAsSeen', { reservationIds: idsToMark });
          state.newReservationCount = 0;
          updateNotificationBadge();
        }
      }

      switch (tabName) {
        case 'home':
          header.innerHTML = `<h1 class="text-2xl font-bold theme-pink">Reservasi Online</h1><p class="text-secondary text-sm mt-1">Pilih treatment atau produk Anda</p>${themeButton}`;
          appContent.innerHTML = renderHomePage();
          setupHomeEventListeners();
          renderTreatments(state.data.treatments);
          break;
        case 'reservations':
          header.innerHTML = `<h1 class="text-2xl font-bold theme-pink">Daftar Reservasi</h1><p class="text-secondary text-sm mt-1">Kelola status reservasi pasien</p>${themeButton}`;
          const resResult = await callBackend('GET', 'getReservationsAndNotifications');
          if (resResult.status === 'success') {
            state.data.allReservations = resResult.data.reservations || [];
            state.newReservationCount = resResult.data.newReservationCount || 0;
            updateNotificationBadge();
            renderReservationsPage(state.data.allReservations);
          } else {
            appContent.innerHTML = `<p class="text-center text-red-500">${resResult.message}</p>`;
          }
          break;
        case 'pasien':
          header.innerHTML = `<h1 class="text-2xl font-bold theme-pink">Manajemen Pasien</h1><p class="text-secondary text-sm mt-1">Cari dan perbarui data pasien</p>${themeButton}`;
          renderPatientsManagementPage(state.data.allPatients);
          break;
        case 'rekap':
          header.innerHTML = `<h1 class="text-2xl font-bold theme-pink">Laporan & Statistik</h1><p class="text-secondary text-sm mt-1">Analisis data reservasi klinik</p>${themeButton}`;
          const rekapResult = await callBackend('GET', 'getRekapData');
          if (rekapResult.status === 'success') {
            state.rekapData = rekapResult.data;
            appContent.innerHTML = renderRekapPage();
            setupRekapEventListeners();
            renderAllRekapVisuals(state.rekapData);
          } else {
            appContent.innerHTML = `<p class="text-center text-red-500">${rekapResult.message}</p>`;
          }
          break;
        case 'management':
          header.innerHTML = `<h1 class="text-2xl font-bold theme-pink">Manajemen Data</h1><p class="text-secondary text-sm mt-1">Kelola data klinik & Pengaturan</p>${themeButton}`;
          const therapistsResult = await callBackend('GET', 'getTherapists');
          if (therapistsResult.status === 'success') state.data.therapists = therapistsResult.data || [];
          appContent.innerHTML = renderManagementPage();
          break;
      }
      updateThemeIcon(localStorage.getItem('theme') || 'light');
    }

    async function fetchDataIfNeeded() {
      if (state.data.treatments.length === 0 || state.data.products.length === 0) {
        const itemsResult = await callBackend('GET', 'getItems');
        if (itemsResult.status === 'success') {
          state.data.treatments = itemsResult.data.treatments || [];
          state.data.products = itemsResult.data.products || [];
        }
      }
      if (state.data.allPatients.length === 0) {
        const patientsResult = await callBackend('GET', 'getPatients', { query: '' });
        if (patientsResult.status === 'success') state.data.allPatients = patientsResult.data || [];
      }
      
      const settingsResult = await callBackend('GET', 'getSettings');
      if (settingsResult.status === 'success' && settingsResult.data) {
          state.data.settings = { ...state.data.settings, ...settingsResult.data };
      }
    }

    function updateNotificationBadge() {
      const badge = document.getElementById('reservation-notification-badge');
      if (badge) {
        badge.textContent = state.newReservationCount;
        badge.classList.toggle('visible', state.newReservationCount > 0);
      }
    }

    // --- DASHBOARD MINI ESTETIK (PERBAIKAN LOGIKA WAKTU) ---
    function renderMiniDashboard(reservations) {
        const today = new Date();
        const todayStr = today.toDateString();
        
        let total = 0, selesai = 0, belumDatang = 0, lewatWaktu = 0;

        reservations.forEach(r => {
            const resDate = new Date(r.Tanggal_Datang);
            if (!isNaN(resDate.getTime()) && resDate.toDateString() === todayStr) {
                total++;
                if (r.Status === 'Selesai') {
                    selesai++;
                } else if (r.Status === 'Menunggu') {
                    // PERBAIKAN: Membandingkan secara akurat dengan jam dan menit saat ini
                    const jamDatang = r.Jam_Datang || '00:00';
                    const jamSplit = jamDatang.replace('.', ':').split(':');
                    
                    const resTime = new Date();
                    resTime.setHours(parseInt(jamSplit[0] || 0), parseInt(jamSplit[1] || 0), 0, 0);
                    
                    if (resTime < today) { // today disini adalah new Date() (waktu detik ini juga)
                        lewatWaktu++;
                    } else {
                        belumDatang++;
                    }
                }
            }
        });

        const displayDate = today.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' });

        return `
        <div class="glass-dashboard rounded-xl p-4 mb-5 shadow-sm text-sm">
            <div class="flex items-center justify-between mb-3 border-b border-pink-200 dark:border-pink-900 pb-2">
                <h3 class="font-bold theme-pink flex items-center gap-2"><i class="fas fa-calendar-day"></i> Info Hari Ini</h3>
                <span class="text-xs text-secondary font-medium">${displayDate}</span>
            </div>
            <div class="grid grid-cols-4 gap-2 text-center">
                <div class="flex flex-col items-center p-2 bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-100 dark:border-gray-700">
                    <span class="text-blue-500 font-bold text-lg leading-tight">${total}</span>
                    <span class="text-[10px] text-secondary uppercase tracking-wide mt-1">Daftar</span>
                </div>
                <div class="flex flex-col items-center p-2 bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-100 dark:border-gray-700">
                    <span class="text-green-500 font-bold text-lg leading-tight">${selesai}</span>
                    <span class="text-[10px] text-secondary uppercase tracking-wide mt-1">Selesai</span>
                </div>
                <div class="flex flex-col items-center p-2 bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-100 dark:border-gray-700">
                    <span class="text-orange-400 font-bold text-lg leading-tight">${belumDatang}</span>
                    <span class="text-[10px] text-secondary uppercase tracking-wide mt-1">Menunggu</span>
                </div>
                <div class="flex flex-col items-center p-2 bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-100 dark:border-gray-700 relative">
                    ${lewatWaktu > 0 ? `<span class="absolute -top-1 -right-1 flex h-3 w-3"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span></span>` : ''}
                    <span class="text-red-500 font-bold text-lg leading-tight">${lewatWaktu}</span>
                    <span class="text-[10px] text-secondary uppercase tracking-wide mt-1">Terlambat</span>
                </div>
            </div>
        </div>`;
    }

    function renderReservationsPage(reservations) {
      const appContent = document.getElementById('app-content');
      
      let htmlContent = renderMiniDashboard(reservations);

      if (!reservations || reservations.length === 0) {
        appContent.innerHTML = htmlContent + `<div class="text-center p-8 text-secondary"><i class="fas fa-calendar-times fa-3x mb-3"></i><p>Tidak ada data reservasi.</p></div>`;
        return;
      }

      const statusStyles = {
        'Menunggu': 'text-blue-500 border-blue-200 bg-blue-50 dark:bg-opacity-10',
        'Selesai': 'text-green-500 border-green-200 bg-green-50 dark:bg-opacity-10'
      };

      const sortedReservations = reservations.sort((a, b) => new Date(b.Tanggal_Datang) - new Date(a.Tanggal_Datang));
      
      htmlContent += `<div class="space-y-4">${sortedReservations.map(res => {
        const visitDate = new Date(res.Tanggal_Datang);
        const displayDate = !isNaN(visitDate.getTime()) ? visitDate.toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }) : 'Tanggal Invalid';
        return `<div class="p-4 rounded-lg shadow bg-card">
                        <div class="flex justify-between items-start">
                            <div><p class="font-bold">${res.Nama_Pasien} <span class="text-sm font-normal text-secondary">(${res.RME})</span></p><p class="text-sm text-secondary">${(function(){try { return JSON.parse(res.Items || '[]').join(', '); }catch(e) { return res.Items; } })()}</p></div>
                            <span class="text-xs font-semibold px-2 py-1 rounded-full border ${statusStyles[res.Status] || 'text-gray-500'}">${res.Status}</span>
                        </div>
                        <p class="text-sm text-secondary mt-2"><i class="fas fa-calendar-alt fa-fw mr-1"></i> ${displayDate} | Jam: ${res.Jam_Datang}</p>
                        <div class="mt-3 flex justify-end items-center gap-3 flex-wrap">

                    <form id="settings-form" class="space-y-3">
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="text-xs text-secondary">Jam Buka</label><input type="time" name="jamBuka" value="${settings.jamBuka}" class="mt-1 w-full rounded-md shadow-sm input-field text-sm" required></div>
                            <div><label class="text-xs text-secondary">Jam Tutup</label><input type="time" name="jamTutup" value="${settings.jamTutup}" class="mt-1 w-full rounded-md shadow-sm input-field text-sm" required></div>
                            <div><label class="text-xs text-secondary">Mulai Istirahat</label><input type="time" name="istirahatMulai" value="${settings.istirahatMulai}" class="mt-1 w-full rounded-md shadow-sm input-field text-sm" required></div>
                            <div><label class="text-xs text-secondary">Selesai Istirahat</label><input type="time" name="istirahatSelesai" value="${settings.istirahatSelesai}" class="mt-1 w-full rounded-md shadow-sm input-field text-sm" required></div>
                        </div>
                        <div><label class="text-xs text-secondary">Maksimal Pasien per Slot Jam</label><input type="number" name="maksSlot" value="${settings.maksSlot}" min="1" max="10" class="mt-1 w-full rounded-md shadow-sm input-field text-sm" required></div>
                        <div class="flex justify-end pt-2"><button type="submit" class="bg-theme-pink text-white px-4 py-1.5 rounded-lg shadow text-sm">Simpan Pengaturan</button></div>
                    </form>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-3"><h2 class="text-xl font-semibold">Manajemen Terapis</h2><button onclick="showTherapistFormModal(null)" class="bg-theme-pink text-white px-3 py-1 rounded-lg shadow text-sm flex items-center gap-2"><i class="fas fa-plus"></i> Tambah</button></div>
                    <div class="space-y-2">${therapistsHtml || '<p class="text-center text-secondary text-sm py-4">Belum ada data.</p>'}</div>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-3"><h2 class="text-xl font-semibold">Manajemen Treatment</h2><button onclick="showItemFormModal(null, 'treatment')" class="bg-theme-pink text-white px-3 py-1 rounded-lg shadow text-sm flex items-center gap-2"><i class="fas fa-plus"></i> Tambah</button></div>
                    <div class="space-y-2">${treatmentsHtml || '<p class="text-center text-secondary text-sm py-4">Belum ada data.</p>'}</div>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-3"><h2 class="text-xl font-semibold">Manajemen Produk</h2><button onclick="showItemFormModal(null, 'product')" class="bg-theme-pink text-white px-3 py-1 rounded-lg shadow text-sm flex items-center gap-2"><i class="fas fa-plus"></i> Tambah</button></div>
                    <div class="space-y-2">${productsHtml || '<p class="text-center text-secondary text-sm py-4">Belum ada data.</p>'}</div>
                </div>
            </div>`;
    }

    // Event listener dinamis untuk form manajemen
    document.addEventListener('submit', async (e) => {
        if(e.target && e.target.id === 'settings-form') {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            const result = await callBackend('POST', 'saveSettings', data);
            if(result.status === 'success') {
                state.data.settings = data;
                showToast('Pengaturan jadwal berhasil disimpan!', 'success');
            } else {
                showToast('Gagal menyimpan pengaturan.', 'error');
            }
        }

    // --- FUNGSI SELESAIKAN RESERVASI ---
    window.showCompleteModal = async (reservationId) => {
      const reservation = state.data.allReservations.find(r => r.ID_Reservasi === reservationId);
      if (!reservation) return showToast('Reservasi tidak ditemukan', 'error');

      const therapistsResult = await callBackend('GET', 'getTherapists');
      const therapists = therapistsResult.status === 'success' ? therapistsResult.data : [];
      const therapistOptions = therapists.map(t => `<option value="${t.Nama_Terapis}">${t.Nama_Terapis}</option>`).join('');

      const currentItems = JSON.parse(reservation.Items || '[]');
      const allItems = [...new Set([...state.data.treatments.map(t => t.Nama), ...state.data.products.map(p => p.Nama)])];
      const itemsHtml = allItems.map(item => `<label class="flex items-center space-x-2 text-sm"><input type="checkbox" name="updatedItems" value="${item}" class="rounded border-gray-300 text-pink-500 shadow-sm focus:border-pink-300 focus:ring focus:ring-pink-200 focus:ring-opacity-50" ${currentItems.includes(item) ? 'checked' : ''}><span>${item}</span></label>`).join('');

      const modalHtml = `
                <div id="complete-modal" class="fixed inset-0 z-40 flex items-center justify-center bg-black bg-opacity-50">
                    <div class="rounded-lg shadow-xl w-full max-w-lg m-4 max-h-[90vh] flex flex-col bg-card">
                        <div class="p-6 border-b border-primary"><h2 class="text-2xl font-bold theme-pink">Selesaikan Reservasi</h2><p class="text-secondary text-sm">${reservation.Nama_Pasien} (${reservation.RME})</p></div>
                        <form id="complete-form" class="p-6 space-y-4 overflow-y-auto">
                            <input type="hidden" name="reservationId" value="${reservationId}">
                            <div><label class="block text-sm font-medium">Update/Tambah Treatment & Produk</label><div class="mt-2 p-3 border rounded-md max-h-40 overflow-y-auto space-y-2 bg-secondary">${itemsHtml}</div></div>
                            <div><label class="block text-sm font-medium">Update Keluhan</label><textarea name="updatedComplaint" class="mt-1 w-full rounded-md input-field" rows="2">${reservation.Keluhan || ''}</textarea></div>
                            <hr class="border-primary"/>
                            <div><label class="block text-sm font-medium">Pilih Terapis/Bidan</label><select name="therapist" class="mt-1 w-full rounded-md shadow-sm input-field" required><option value="" disabled selected>-- Pilih Terapis --</option>${therapistOptions}</select></div>
                            <h3 class="text-lg font-semibold pt-2 border-t border-primary">Data Pemeriksaan</h3>
                            <div class="grid grid-cols-2 gap-4">
                                <div><label class="text-sm">Suhu (°C)</label><input type="number" step="0.1" name="temp" class="mt-1 w-full rounded-md input-field"></div>
                                <div><label class="text-sm">Berat (kg)</label><input type="number" step="0.1" name="weight" class="mt-1 w-full rounded-md input-field"></div>
                                <div><label class="text-sm">Tinggi (cm)</label><input type="number" step="0.1" name="height" class="mt-1 w-full rounded-md input-field"></div>
                                <div><label class="text-sm">LILA (cm)</label><input type="number" step="0.1" name="lila" class="mt-1 w-full rounded-md input-field"></div>
                            </div>
                            <div><label class="text-sm">Catatan Pemeriksaan</label><textarea name="examNotes" class="mt-1 w-full rounded-md input-field" rows="2"></textarea></div>
                        </form>
                        <div class="p-4 border-t border-primary mt-auto"><div class="flex justify-end gap-3"><button type="button" onclick="closeModal('complete-modal')" class="px-4 py-2 bg-gray-200 dark:bg-gray-600 rounded-lg">Batal</button><button type="submit" form="complete-form" class="px-4 py-2 bg-theme-pink text-white rounded-lg">Simpan</button></div></div>
                    </div>
                </div>`;
      document.getElementById('modals-container').innerHTML = modalHtml;
      
      // PERBAIKAN: Fungsi penanganan (handleCompleteSubmit) ditambahkan disini
      document.getElementById('complete-form').addEventListener('submit', handleCompleteSubmit);
    };

    // PERBAIKAN: Logika penyimpanan data saat ditekan tombol Simpan (Selesai)
    const handleCompleteSubmit = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());

        // Kumpulkan checkbox yang dicentang
        const updatedItems = Array.from(e.target.querySelectorAll('input[name="updatedItems"]:checked')).map(cb => cb.value);
        data.updatedItems = updatedItems;

        // Kelompokkan data pemeriksaan
        data.examData = {
            suhu: data.temp,
            berat: data.weight,
            tinggi: data.height,
            lila: data.lila,
            catatan: data.examNotes
        };

        const result = await callBackend('POST', 'completeReservation', data);
        if (result.status === 'success') {
            closeModal('complete-modal');
            showToast('Reservasi diselesaikan!', 'success');
            navigateTo('reservations');
        } else {
            showToast(`Gagal: ${result.message}`, 'error');
        }
    };


    // --- RESCHEDULE RESERVATION ---
    window.requestRescheduleAction = (reservationId) => {
      if (state.isAuthenticated) {
        showRescheduleModal(reservationId);
      } else {
        state.pendingAction = () => showRescheduleModal(reservationId);
        showPasswordModal();
      }
    };

    window.showRescheduleModal = (reservationId) => {
      const reservation = state.data.allReservations.find(r => r.ID_Reservasi === reservationId);
      if (!reservation) return showToast('Reservasi tidak ditemukan', 'error');
      
      let resDate = "";
      if(reservation.Tanggal_Datang) {
          const d = new Date(reservation.Tanggal_Datang);
          if(!isNaN(d.getTime())) {
              // Koreksi Timezone agar tanggal tidak meleset
              const offset = d.getTimezoneOffset() * 60000;
              const localDate = new Date(d.getTime() - offset);
              resDate = localDate.toISOString().split('T')[0];
          }
      }

      const modalHtml = `
        <div id="reschedule-modal" class="fixed inset-0 z-40 flex items-center justify-center bg-black bg-opacity-50">
            <div class="rounded-lg shadow-xl w-full max-w-sm m-4 bg-card relative">
                <button class="modal-close-btn" onclick="closeModal('reschedule-modal')"><i class="fas fa-times"></i></button>
                <form id="reschedule-form" class="p-6 space-y-4">
                    <h2 class="text-xl font-bold theme-pink">Ubah Jadwal</h2>
                    <p class="text-xs text-secondary mb-4">${reservation.Nama_Pasien} - ${reservation.RME}</p>
                    <input type="hidden" name="reservationId" value="${reservationId}">
                    <div>
                        <label class="block text-sm font-medium">Tanggal Baru</label>
                        <input type="date" name="visitDate" id="rescheduleDate" class="mt-1 w-full rounded-md shadow-sm input-field" value="${resDate}" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Jam Baru</label>
                        <select name="visitTime" id="rescheduleTime" class="mt-1 w-full rounded-md shadow-sm input-field" required></select>
                    </div>
                    <div class="mt-6 flex justify-end gap-3">
                        <button type="button" onclick="closeModal('reschedule-modal')" class="px-4 py-2 bg-gray-200 dark:bg-gray-600 rounded-lg">Batal</button>
                        <button type="submit" class="px-4 py-2 bg-theme-pink text-white rounded-lg">Simpan</button>
                    </div>
                </form>
            </div>
        </div>
      `;
      document.getElementById('modals-container').innerHTML = modalHtml;
      
      const timeSelect = document.getElementById('rescheduleTime');
      populateTimeOptionsForSelect(timeSelect);
      
      // Set previous time if available
      if(reservation.Jam_Datang) {
          Array.from(timeSelect.options).forEach(opt => {
              if(opt.value === reservation.Jam_Datang) opt.selected = true;
          });
      }

      document.getElementById('reschedule-form').addEventListener('submit', handleRescheduleSubmit);
    };

    const handleRescheduleSubmit = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());
        
        // Cek ketersediaan
        const isAvailable = await checkScheduleAvailability(data.visitDate, data.visitTime);
        if (!isAvailable) {
            document.getElementById('full-schedule-popup').classList.remove('hidden');
            return;
        }

        const result = await callBackend('POST', 'rescheduleReservation', data);
        if(result.status === 'success') {
            closeModal('reschedule-modal');
            showToast('Jadwal berhasil diubah!', 'success');
            navigateTo('reservations');
        } else {
            showToast(`Gagal: ${result.message}`, 'error');
        }
    };


    const handleReservationSubmit = async (e) => {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());
      data.selectedItems = state.selectedItems;

      const checkResult = await callBackend('GET', 'checkExistingPatient', { patientName: data.patientName, requesterName: data.requesterName });

      if (checkResult.status === 'success' && checkResult.data.length > 0) {
        showDuplicatePatientModal(checkResult.data, data);
      } else {
        const result = await callBackend('POST', 'newReservation', data);
        if (result.status === 'success') {
          closeModal('reservation-modal');
          showToast(`Reservasi berhasil! RME: ${result.data.rme}`, 'success');
          state.selectedItems = [];
          updateCartFab();
          navigateTo('reservations');
        } else {
          showToast(`Gagal: ${result.message}`, 'error');
        }
      }
    };

    function showDuplicatePatientModal(matches, originalFormData) {
      const matchesHtml = matches.map((p, index) => `
            <label for="match-${index}" class="duplicate-patient-item block p-3 border-b border-primary last:border-b-0 hover:bg-pink-50 dark:hover:bg-gray-700 cursor-pointer transition-colors duration-200">
                <div class="flex items-start">
                    <input type="radio" id="match-${index}" name="selectedPatient" value="${p.RME}" class="mt-1 mr-3 text-pink-500 focus:ring-pink-500">
                    <div class="flex-1">
                        <div class="flex justify-between">
                            <span class="font-semibold patient-name">${p.Nama_Pasien}</span> 
                            <span class="text-sm text-secondary patient-rme">(${p.RME})</span>
                        </div>
                        <p class="text-sm text-secondary mt-1 patient-info"><i class="fas fa-phone-alt fa-xs mr-1"></i>${p.No_HP} <br> <i class="fas fa-map-marker-alt fa-xs mr-1"></i>${p.Alamat}</p>
                    </div>
                </div>
            </label>
        `).join('');

      const modalHtml = `
        <div id="duplicate-patient-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-60 backdrop-blur-sm transition-opacity">
            <div class="rounded-xl shadow-2xl w-full max-w-md m-4 bg-card relative overflow-hidden transform transition-all flex flex-col max-h-[90vh]">
                <div class="p-6 pb-2">
                    <button class="modal-close-btn absolute top-3 right-3 text-gray-400 hover:text-gray-600 z-10" onclick="closeModal('duplicate-patient-modal')"><i class="fas fa-times text-xl"></i></button>
                    <div class="text-center mb-4">
                        <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-pink-100 mb-2"><i class="fas fa-user-friends text-pink-600 text-xl"></i></div>
                        <h2 class="text-xl font-bold theme-pink">Konfirmasi Data Pasien</h2>
                        <p class="text-sm text-secondary mt-1">Kami menemukan data yang mirip.</p>
                    </div>
                    <div class="relative mb-3">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fas fa-search text-gray-400"></i></div>
                        <input type="text" id="duplicate-search-input" class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg leading-5 bg-white placeholder-gray-500 focus:outline-none focus:placeholder-gray-400 focus:border-pink-500 focus:ring-1 focus:ring-pink-500 sm:text-sm transition duration-150 ease-in-out dark:bg-gray-800 dark:border-gray-600 dark:text-gray-100 input-field" placeholder="Cari nama atau RME disini..." autofocus autocomplete="off">
                    </div>
                    <p class="text-xs text-secondary mb-2">Pilih data yang sesuai dari daftar di bawah:</p>
                </div>
                <div class="flex-1 overflow-y-auto px-6 pb-2" id="duplicate-list-container">
                    <div class="border border-gray-200 dark:border-gray-700 rounded-lg shadow-inner bg-gray-50 dark:bg-gray-900">
                        ${matchesHtml}
                        <div id="no-duplicate-found" class="hidden p-8 text-center text-sm text-gray-500 dark:text-gray-400"><i class="fas fa-search-minus text-2xl mb-2 text-gray-300 dark:text-gray-500"></i><p>Data tidak ditemukan.</p></div>
                    </div>
                </div>
                <div class="p-4 bg-gray-50 dark:bg-gray-800/50 flex flex-col sm:flex-row gap-3 justify-center border-t border-gray-100 dark:border-gray-700 mt-2">
                    <button id="btn-not-me" class="w-full sm:w-auto px-4 py-2 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-pink-500 transition-colors shadow-sm"><i class="fas fa-user-plus mr-1"></i> Ini Pasien Baru</button>
                    <button id="btn-its-me" class="w-full sm:w-auto px-4 py-2 bg-theme-pink text-white rounded-lg text-sm font-medium hover:brightness-110 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-pink-500 shadow-md transition-all transform hover:scale-105"><i class="fas fa-check mr-1"></i> Ya, Gunakan Data Ini</button>
                </div>
            </div>
        </div>`;

      document.getElementById('modals-container').innerHTML = modalHtml;
      
      const searchInput = document.getElementById('duplicate-search-input');
      const items = document.querySelectorAll('.duplicate-patient-item');
      const noResult = document.getElementById('no-duplicate-found');
      setTimeout(() => searchInput.focus(), 100);

      searchInput.addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        let visibleCount = 0;
        items.forEach(item => {
          const name = item.querySelector('.patient-name').textContent.toLowerCase();
          const rme = item.querySelector('.patient-rme').textContent.toLowerCase();
          const info = item.querySelector('.patient-info').textContent.toLowerCase();
          if (name.includes(term) || rme.includes(term) || info.includes(term)) { item.style.display = 'block'; visibleCount++; } else { item.style.display = 'none'; }
        });
        if (visibleCount === 0) { noResult.classList.remove('hidden'); } else { noResult.classList.add('hidden'); }
      });

      document.getElementById('btn-its-me').addEventListener('click', async () => {
        const selectedRME = document.querySelector('input[name="selectedPatient"]:checked');
        if (!selectedRME) { showToast('Silakan pilih salah satu data pasien.', 'warning'); return; }
        originalFormData.existingRME = selectedRME.value;
        const result = await callBackend('POST', 'newReservation', originalFormData);
        if (result.status === 'success') {
          closeModal('reservation-modal'); closeModal('duplicate-patient-modal'); showToast(`Reservasi untuk pasien lama berhasil!`, 'success');
          state.selectedItems = []; updateCartFab(); navigateTo('reservations');
        } else { showToast(`Gagal: ${result.message}`, 'error'); }
      });

      document.getElementById('btn-not-me').addEventListener('click', async () => {
        const result = await callBackend('POST', 'newReservation', originalFormData);
        if (result.status === 'success') {
          closeModal('reservation-modal'); closeModal('duplicate-patient-modal'); showToast(`Reservasi untuk pasien baru berhasil! RME: ${result.data.rme}`, 'success');
          state.selectedItems = []; updateCartFab(); navigateTo('reservations');
        } else { showToast(`Gagal: ${result.message}`, 'error'); }
      });
    }

    window.showTherapistFormModal = (therapist) => {
      const isEdit = therapist !== null;
      const modalHtml = `
            <div id="therapist-form-modal" class="fixed inset-0 z-40 flex items-center justify-center bg-black bg-opacity-50">
                <div class="rounded-lg shadow-xl w-full max-w-lg m-4 bg-card relative">

                    <form id="therapist-form" class="p-6">
                        <h2 class="text-2xl font-bold mb-4 theme-pink">${isEdit ? 'Edit' : 'Tambah'} Terapis</h2>
                        <input type="hidden" name="id" value="${isEdit ? therapist.ID_Terapis : ''}">
                        <div class="space-y-4">
                            <div><label class="block text-sm font-medium">Nama Terapis</label><input type="text" name="name" class="mt-1 block w-full rounded-md shadow-sm input-field" value="${isEdit ? therapist.Nama_Terapis : ''}" required></div>
                            <div><label class="block text-sm font-medium">Status</label><select name="status" class="mt-1 block w-full rounded-md shadow-sm input-field"><option value="Aktif" ${isEdit && therapist.Status === 'Aktif' ? 'selected' : ''}>Aktif</option><option value="Tidak Aktif" ${isEdit && therapist.Status === 'Tidak Aktif' ? 'selected' : ''}>Tidak Aktif</option></select></div>
                        </div>
                        <div class="mt-6 flex justify-end gap-3"><button type="button" onclick="closeModal('therapist-form-modal')" class="px-4 py-2 bg-gray-200 dark:bg-gray-600 rounded-lg">Batal</button><button type="submit" class="px-4 py-2 bg-theme-pink text-white rounded-lg">Simpan</button></div>
                    </form>
                </div>
            </div>`;
      document.getElementById('modals-container').innerHTML = modalHtml;
      document.getElementById('therapist-form').addEventListener('submit', handleTherapistFormSubmit);
    };

    const handleTherapistFormSubmit = async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());
      const result = await callBackend('POST', 'addOrUpdateTherapist', data);

    window.checkForDuplicatePatient = async () => {
      const form = document.getElementById('reservation-form');
      if (!form) return;
      const requesterName = form.requesterName.value.trim(); const patientName = form.patientName.value.trim(); const phone = form.phone.value.trim();
      if ((!requesterName && !patientName) || phone.length < 3) { document.getElementById('duplicate-warning').classList.add('hidden'); state.duplicatePatientCheck.matches = []; return; }
      const now = Date.now();
      if (state.duplicatePatientCheck.isChecking || (state.duplicatePatientCheck.lastChecked && now - state.duplicatePatientCheck.lastChecked < 1000)) return;
      state.duplicatePatientCheck.isChecking = true; state.duplicatePatientCheck.lastChecked = now;
      try {
        const result = await callBackend('GET', 'checkExistingPatient', { patientName: patientName, requesterName: requesterName, phone: phone });
        if (result.status === 'success' && result.data.length > 0) { state.duplicatePatientCheck.matches = result.data; document.getElementById('duplicate-warning').classList.remove('hidden'); } else { state.duplicatePatientCheck.matches = []; document.getElementById('duplicate-warning').classList.add('hidden'); }
      } catch (error) { console.error('Error checking duplicate patient:', error); } finally { state.duplicatePatientCheck.isChecking = false; }
    };

    function setupReservationFormListeners() {

      });

        const visitDate = document.querySelector('input[name="visitDate"]').value;
        const visitTime = e.target.value;
        if (visitDate && visitTime) {

          if (!isAvailable) document.getElementById('full-schedule-popup').classList.remove('hidden');
        }
      });

    const populateTimeOptionsForSelect = (timeSelect) => {
      if (!timeSelect) return;

      const isPartus = state.selectedItems.some(item => item.category === 'Paket Bersalin/Partus');
      timeSelect.innerHTML = isPartus ? '<option value="24_jam">24 Jam (Khusus Partus)</option>' : '';
      if (isPartus) return;

      // Gunakan pengaturan dari backend
      const settings = state.data.settings;
      
      let startTime = new Date();
      let endTime = new Date();
      
      const [startH, startM] = (settings.jamBuka || '08:30').split(':');
      const [endH, endM] = (settings.jamTutup || '21:30').split(':');
      
      startTime.setHours(startH, startM, 0, 0);
      endTime.setHours(endH, endM, 0, 0);

      const [breakStartH, breakStartM] = (settings.istirahatMulai || '12:00').split(':');
      const [breakEndH, breakEndM] = (settings.istirahatSelesai || '13:00').split(':');
      
      const breakStart = new Date(); breakStart.setHours(breakStartH, breakStartM, 0, 0);
      const breakEnd = new Date(); breakEnd.setHours(breakEndH, breakEndM, 0, 0);

      while (startTime <= endTime) {
        // Cek apakah waktu saat ini masuk dalam jam istirahat
        const isBreakTime = startTime >= breakStart && startTime < breakEnd;

        if (!isBreakTime) {
          const timeString = startTime.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace(/\./g, ':');
          timeSelect.appendChild(new Option(timeString, timeString));
        }
        startTime.setMinutes(startTime.getMinutes() + 30);
      }
    };

    const updateAgeAndDay = (e) => {
      const dobInput = e.target.value;
      const ageOutput = document.getElementById('age-output');
      if (!dobInput) { ageOutput.value = ''; return; }
      const dob = new Date(dobInput); const now = new Date();
      if (isNaN(dob.getTime()) || dob > now) { ageOutput.value = 'Tgl lahir invalid'; return; }
      let years = now.getFullYear() - dob.getFullYear(); let months = now.getMonth() - dob.getMonth(); let days = now.getDate() - dob.getDate();
      if (days < 0) { months--; days += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
      if (months < 0) { years--; months += 12; }
      ageOutput.value = `${years} thn, ${months} bln, ${days} hr`;
    };

      const modalHtml = `

    function calculateStatsFromReservations(reservations, allPatients) {
      const stats = { dailyTrend: {}, categoryCounts: {}, treatmentNameCounts: {}, genderCounts: {}, dayCounts: {}, peakHourCounts: {}, monthCounts: {}, therapistCounts: {}, calendarData: {} };
      const treatmentCategoryMap = state.data.treatments.reduce((map, item) => ({ ...map, [item.Nama]: item.Kategori }), {});
      const patientDataMap = allPatients.reduce((map, p) => ({ ...map, [p.RME]: p }), {});
      const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      for (let i = 0; i < 24; i++) stats.peakHourCounts[i.toString().padStart(2, '0') + ':00'] = 0;
      reservations.forEach(res => {
        const visitDate = new Date(res.Tanggal_Datang); if (isNaN(visitDate.getTime())) return;
        const dateKey = visitDate.toISOString().split('T')[0]; stats.dailyTrend[dateKey] = (stats.dailyTrend[dateKey] || 0) + 1; stats.calendarData[dateKey] = (stats.calendarData[dateKey] || 0) + 1;
        try { JSON.parse(res.Items || '[]').forEach(itemName => { stats.treatmentNameCounts[itemName] = (stats.treatmentNameCounts[itemName] || 0) + 1; const category = treatmentCategoryMap[itemName]; if (category) stats.categoryCounts[category] = (stats.categoryCounts[category] || 0) + 1; }); } catch (e) { }
        const patient = patientDataMap[res.RME]; if (patient && patient.Jenis_Kelamin) stats.genderCounts[patient.Jenis_Kelamin] = (stats.genderCounts[patient.Jenis_Kelamin] || 0) + 1;
        stats.dayCounts[days[visitDate.getDay()]] = (stats.dayCounts[days[visitDate.getDay()]] || 0) + 1;
        const hourKey = visitDate.getHours().toString().padStart(2, '0') + ':00'; stats.peakHourCounts[hourKey] = (stats.peakHourCounts[hourKey] || 0) + 1;
        const monthYearKey = `${months[visitDate.getMonth()]} ${visitDate.getFullYear()}`; stats.monthCounts[monthYearKey] = (stats.monthCounts[monthYearKey] || 0) + 1;
        if (res.Terapis) stats.therapistCounts[res.Terapis] = (stats.therapistCounts[res.Terapis] || 0) + 1;
      });
      return stats;
    }

      const date = state.currentCalendarDate; const month = date.getMonth(); const year = date.getFullYear(); const firstDay = new Date(year, month, 1); const lastDay = new Date(year, month + 1, 0);
      let html = `<div class="flex justify-between items-center mb-4"><button onclick="changeMonth(-1)" class="p-2"><i class="fas fa-chevron-left"></i></button><h4 class="font-bold text-center">${date.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' })}</h4><button onclick="changeMonth(1)" class="p-2"><i class="fas fa-chevron-right"></i></button></div><div class="grid grid-cols-7 text-center font-semibold text-sm mb-2">${['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'].map(d => `<div>${d}</div>`).join('')}</div><div class="grid grid-cols-7 gap-1">`;
      for (let i = 0; i < firstDay.getDay(); i++) html += `<div></div>`;
      for (let day = 1; day <= lastDay.getDate(); day++) {
        const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`; const count = calendarData[dateKey] || 0;
        let colorClass = 'bg-gray-200 dark:bg-gray-700'; if (count > 0) colorClass = 'bg-green-200 dark:bg-green-800'; if (count > 2) colorClass = 'bg-yellow-200 dark:bg-yellow-700'; if (count > 5) colorClass = 'bg-red-300 dark:bg-red-800';
        html += `<div class="aspect-square flex flex-col justify-center items-center rounded-lg ${colorClass} text-xs"><span class="font-semibold text-sm">${day}</span>${count > 0 ? `<span class="mt-1">${count}</span>` : ''}</div>`;
      }
      html += `</div>`; container.innerHTML = html;
    }

    window.changeMonth = (direction) => { state.currentCalendarDate.setMonth(state.currentCalendarDate.getMonth() + direction); renderCalendar((state.rekapFilteredData || state.rekapData).stats.calendarData); }

    function renderRekapTable(reservations) {
      const container = document.getElementById('table-container'); if (!container) return;
      if (!reservations || reservations.length === 0) { container.innerHTML = `<p class="text-center text-secondary py-4">Tidak ada data untuk filter ini.</p>`; return; }
      let tableHTML = `<table class="w-full text-sm text-left text-secondary"><thead class="text-xs uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400 sticky top-0"><tr><th class="px-4 py-2">Tgl Datang</th><th class="px-4 py-2">Pasien</th><th class="px-4 py-2">Items</th><th class="px-4 py-2">Status</th></tr></thead><tbody>`;
      reservations.sort((a, b) => new Date(b.Timestamp) - new Date(a.Timestamp)).forEach(res => { const d = new Date(res.Tanggal_Datang); const dateStr = isNaN(d.getTime()) ? 'Invalid' : d.toLocaleDateString('id-ID'); tableHTML += `<tr class="border-b border-primary bg-card"><td class="px-4 py-2">${dateStr}</td><td class="px-4 py-2 font-medium text-primary">${res.Nama_Pasien}</td><td class="px-4 py-2">${JSON.parse(res.Items || '[]').join(', ')}</td><td class="px-4 py-2">${res.Status}</td></tr>`; });
      tableHTML += `</tbody></table>`; container.innerHTML = tableHTML;
    }

    window.printSection = async (elementId, title) => {
      const { jsPDF } = window.jspdf || {}; if (!jsPDF || !window.html2canvas) { showToast('Library PDF/Screenshot tidak dimuat.', 'error'); return; }
      const elementToPrint = document.getElementById(elementId); if (!elementToPrint) return;
      showToast('Mempersiapkan PDF...', 'info'); setLoading(true);
      try {
        const pdf = new jsPDF('p', 'mm', 'a4'); const isDark = document.documentElement.classList.contains('dark'); const backgroundColor = isDark ? '#111827' : '#ffffff';
        pdf.setFontSize(16); pdf.text(title, 105, 15, null, null, 'center');
        const canvas = await html2canvas(elementToPrint, { scale: 2, useCORS: true, backgroundColor: backgroundColor }); const imgData = canvas.toDataURL('image/png'); const imgProps = pdf.getImageProperties(imgData);
        const pdfWidth = pdf.internal.pageSize.getWidth() - 20; const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width; let position = 30;
        pdf.addImage(imgData, 'PNG', 10, position, pdfWidth, pdfHeight);
        pdf.save(`${title.replace(/ /g, '-')}.pdf`); showToast('PDF berhasil dibuat!', 'success');
      } catch (error) { console.error('PDF generation error:', error); showToast('Gagal membuat PDF.', 'error'); } finally { setLoading(false); }
    }

    window.handlePrintReservation = async (reservationId) => {
      showToast('Mempersiapkan PDF...', 'info'); setLoading(true);
      const result = await callBackend('GET', 'generatePdf', { reservationId }); setLoading(false);
      if (result.status === 'success' && result.data.base64) { downloadPdfFromBase64(result.data.base64, result.data.fileName); showToast('PDF berhasil dibuat!', 'success'); } else { showToast(`Gagal: ${result.message}`, 'error'); }
    };

    function downloadPdfFromBase64(base64String, fileName) {
      try {
        const byteCharacters = atob(base64String); const byteNumbers = new Array(byteCharacters.length);
        for (let i = 0; i < byteCharacters.length; i++) byteNumbers[i] = byteCharacters.charCodeAt(i);
        const byteArray = new Uint8Array(byteNumbers); const blob = new Blob([byteArray], { type: 'application/pdf' }); const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.style.display = 'none'; a.href = url; a.download = fileName; document.body.appendChild(a); a.click();
        window.URL.revokeObjectURL(url); a.remove();
      } catch (error) { console.error('Download PDF error:', error); showToast('Gagal mengunduh PDF.', 'error'); }
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyInitialTheme(); runOpeningAnimation(); setupEventListeners(); navigateTo('home');
    });
  </script>
</body>
</html>
